<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VestIA | Boutique Inteligente</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- navbar principal -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">VestIA</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#catalogo">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="#asistente">Asistente IA</a></li>
            <li class="nav-item">
              <a class="nav-link position-relative" href="#carrito">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartCount" class="badge bg-dark cart-badge">0</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- hero -->
  <section class="hero d-flex align-items-center">
    <div class="container text-center">
      <h1>Tu estilista personal favorito</h1>
      <p>Descubre outfits ideales con las mejores combinaciones</p>
      <a href="#catalogo" class="btn btn-dark mt-3">Explorar catálogo</a>
    </div>
  </section>

  <!-- catálogo -->
  <main class="container my-5" id="catalogo">

    <div class="row mb-4">
      <div class="col text-center">
        <h2 class="section-title">Catálogo de productos</h2>
      </div>
    </div>

    <!-- filtros -->
    <aside class="row mb-4">
      <div class="col-md-3">
        <div class="filter-box">
          <h5>Filtros</h5>

          <label class="form-label">Categoría</label>
          <select id="categorySelect" class="form-select mb-3">
            <option value="">Todos</option>
            <option value="tops">Blusas</option>
            <option value="pants">Pantalones</option>
            <option value="dresses">Vestidos</option>
            <option value="accessories">Accesorios</option>
          </select>

          <label class="form-label">Color</label>
          <select id="colorSelect" class="form-select mb-3">
            <option value="">Todos</option>
            <option value="black">Negro</option>
            <option value="white">Blanco</option>
            <option value="beige">Beige</option>
          </select>

          <label class="form-label">Talla</label>
          <select id="sizeSelect" class="form-select">
            <option value="">Todas</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
          </select>
        </div>
      </div>

      <!-- productos -->
      <div class="col-md-9">
        <div id="productsGrid" class="row g-4">
          <!-- cards dinamicos -->
        </div>

        <!-- paginacion -->
        <nav class="mt-4 d-flex justify-content-center">
          <ul id="pagination" class="pagination"></ul>
        </nav>
      </div>
    </aside>
  </main>

  <!-- asistente ia -->
  <section class="assistant" id="asistente">
    <div class="container">
      <h2 class="section-title text-center">Asistente de estilo VestIA</h2>

      <div class="chatbox mx-auto">
        <div class="chat-messages">
          <p class="bot-message">👋 Hola, soy VestIA. ¿Buscas algo especial hoy?</p>
        </div>



        <div class="chat-input">
          <input type="file" id="imageUpload" accept="image/*" style="display: none;">
          <button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('imageUpload').click()">
            <i class="fa-solid fa-image"></i>
          </button>
          <input type="text" class="form-control" placeholder="Escribe tu mensaje...">
          <button class="btn btn-dark"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </section>

  <!-- footer -->
  <footer class="footer">
    <div class="container text-center">
      <p>© 2026 VestIA</p>
    </div>
  </footer>
  <!-- todos los scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/products.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/filters.js"></script>
  <script type="module" src="js/chatbot.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
<script type="module">
  import { applyPreferencesToFilters, setupFilterListeners } from './js/profile.js';

  // Aplicar preferencias guardadas al cargar la página
  document.addEventListener('DOMContentLoaded', () => {
    applyPreferencesToFilters();
    setupFilterListeners();
  });
</script>
